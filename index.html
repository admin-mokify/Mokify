<!doctype html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mokify — jau netrukus</title>
<meta name="description" content="Mokify — platforma, kurioje moksleiviai mokosi vieni iš kitų. Jau netrukus.">
<link rel="icon" href="assets/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --paper: #FFFFFF;
    --paper-line: #DCE5F1;
    --margin: #C65A52;
    --ink-900: #201E1B;
    --ink-500: #6F695D;
    --pen-blue: #24437A;
    --pen-blue-hover: #1B3460;
    --highlighter: #FCE477;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent 63px, var(--margin) 63px, var(--margin) 65px, transparent 65px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--paper-line) 35px, var(--paper-line) 36px);
    color: var(--ink-900);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  main {
    min-height: 100%;
    display: flex;
    align-items: center;
    padding: 64px 24px 64px 96px;
  }

  .stack {
    max-width: 620px;
    animation: rise 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .logo {
    display: block;
    width: 72px;
    height: 72px;
    margin-bottom: 40px;
  }

  h1 {
    margin: 0 0 20px;
    font-family: 'Bricolage Grotesque', Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.5rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
  }

  h1 mark {
    background: linear-gradient(to bottom, transparent 58%, var(--highlighter) 58%, var(--highlighter) 92%, transparent 92%);
    color: inherit;
    padding: 0 0.06em;
  }

  p {
    margin: 0 0 32px;
    max-width: 34em;
    color: var(--ink-500);
    font-size: 1.15rem;
  }

  a.contact {
    display: inline-block;
    padding: 12px 22px;
    border: 2px solid var(--ink-900);
    border-radius: 8px;
    background: var(--pen-blue);
    box-shadow: 4px 4px 0 var(--ink-900);
    color: #FFFFFF;
    font-weight: 500;
    text-decoration: none;
    transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
  }

  a.contact:hover {
    background: var(--pen-blue-hover);
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink-900);
  }

  a.contact:focus-visible {
    outline: 3px solid var(--highlighter);
    outline-offset: 3px;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stack { animation: none; }
    a.contact { transition: none; }
  }

  @media (max-width: 600px) {
    body {
      background-image:
        linear-gradient(to right, transparent 27px, var(--margin) 27px, var(--margin) 29px, transparent 29px),
        repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--paper-line) 35px, var(--paper-line) 36px);
    }
    main { padding: 48px 16px 48px 48px; }
    .logo { width: 60px; height: 60px; margin-bottom: 32px; }
  }
</style>
</head>
<body>
<main>
  <div class="stack">
    <img class="logo" src="assets/img/logo-mark.png" alt="Mokify">
    <h1>Mokify <mark>jau netrukus</mark></h1>
    <p>Kuriame platformą, kurioje moksleiviai mokosi vieni iš kitų. Mokykloms paprasta įdiegti, moksleiviams visada nemokama.</p>
    <a class="contact" href="mailto:admin@mokify.net">Susisiekite: admin@mokify.net</a>
  </div>
</main>
</body>
</html>
